[pytest]
testpaths = tests
# Make the AuthService rootdir (where app.py lives) importable from the
# tests/ directory. Without this, `import app` in conftest.py only works
# when the CWD happens to be AuthService/ (e.g. `python3 -m pytest` from
# there) and breaks on clean CI runners where the CWD may differ.
pythonpath = .
