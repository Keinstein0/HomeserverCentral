# =============================================================================
# nginx config for the production Homepage container
# =============================================================================
# Serves the SvelteKit static build (adapter-static). Static auth pages
# (/login.html, /403.html, ...) and SvelteKit's fallback index.html are all
# part of the bundle. The SPA fallback keeps deep links working while still
# returning index.html as text/html.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for the JS/CSS/SVG/JSON bundle
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    # SvelteKit emits immutable, content-hashed assets under /_app/immutable.
    # Cache them aggressively; version.json and everything else use revalidation.
    location /_app/immutable/ {
        include /etc/nginx/mime.types;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static auth pages must never be cached (they drive the login flow).
    location = /login.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Generic static assets (css/js/img referenced directly).
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Error pages preserve their true status codes: Caddy's matrix_gate
    # snippet raises `error * 403` and its handle_errors rewrites to
    # /403.html before proxying here — the `error_page ... =` indirection in
    # the exact-match locations makes nginx answer with the matching error
    # status (not 200) while still serving the page body, so the status
    # survives the Caddy -> homepage proxy hop. Generic internal errors
    # (e.g. missing assets) also serve the matching page with its status.
    error_page 401 /401.html;
    error_page 403 /403.html;
    error_page 404 /404.html;

    location = /401.html {
        error_page 401 @serve401;
        return 401;
    }
    location = /403.html {
        error_page 403 @serve403;
        return 403;
    }
    location = /404.html {
        error_page 404 @serve404;
        return 404;
    }

    location @serve401 {
        root /usr/share/nginx/html;
    }
    location @serve403 {
        root /usr/share/nginx/html;
    }
    location @serve404 {
        root /usr/share/nginx/html;
    }

    # SPA fallback for all other routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Don't leak the nginx version.
    server_tokens off;
}
