services:
  # ============================================================
  # Auth Service - Matrix Auth Gateway
  # ============================================================
  # Flask app for Matrix room-based authentication
  # See: AuthService/whatisthis.md for details
  matrix-auth-gateway:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: matrix-auth-gateway
    ports:
      - "5000:5000"
    environment:
      - HOMESERVER_URL=${HOMESERVER_URL:-http://tuwunel:8008}
      - BOT_ACCESS_TOKEN=${BOT_ACCESS_TOKEN}
      - GATEWAY_SECRET_KEY=${GATEWAY_SECRET_KEY}
      - MATRIX_SERVER_NAME=${MATRIX_SERVER_NAME:-keinstein0.ch}
      - SESSION_MAX_AGE=604800
      - MEMBERSHIP_CACHE_TTL=60
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - homeserver_internal
    restart: unless-stopped

  # ============================================================
  # Status API - System Status Monitoring
  # ============================================================
  # Lightweight Go microservice for checking service health.
  # See: StatusAPI/designfile.md for architecture details
  status-api:
    build:
      context: .
      dockerfile: StatusAPI/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-homeserver}_status-api
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-10}
      - AUTH_SERVICE_URL=http://matrix-auth-gateway:5000
      - HOMESERVER_URL=${HOMESERVER_URL:-http://tuwunel:8008}
      - HOMEPAGE_URL=http://homepage:5173
      - CADDY_URL=http://caddy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - homeserver_internal
    depends_on:
      matrix-auth-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Homepage - Svelte/Vite Application
  # ============================================================
  # Main web application with live previews via Vite
  homepage:
    build:
      context: Homepage
      dockerfile: Dockerfile.dev
    container_name: ${COMPOSE_PROJECT_NAME:-homeserver}_homepage
    ports:
      - "5173:5173"  # Vite dev server
      - "4173:4173"  # Vite preview (production-like)
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
      - VITE_AUTH_SERVICE_URL=http://matrix-auth-gateway:5000
      - VITE_MATRIX_SERVER=${MATRIX_SERVER_NAME:-keinstein0.ch}
    volumes:
      - ./Homepage:/app:rw
      - homepage_node_modules:/app/node_modules
      - static_build:/build_output
    networks:
      - homeserver_internal
    profiles:
      - dev
    #command: npm run dev -- --host 0.0.0.0

  # ============================================================
  # Caddy - Reverse Proxy & Auth Handler
  # ============================================================
  # Handles routing, TLS, and Matrix auth forwarding
  caddy:
    image: caddy:2.11
    container_name: ${COMPOSE_PROJECT_NAME:-homeserver}_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # For HTTP/3
    volumes:
      - ./Caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_build:/apps/homepage:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_INGRESS_IP=${CADDY_INGRESS_IP:-}

      - SITE_DOMAIN=http://localhost
      - PROTOCOL=http
      - AUTO_HTTPS=off


    networks:
      - homeserver_internal
    depends_on:
      matrix-auth-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Tuwunel Mock - Matrix Homeserver mock (test/dev only)
  # ============================================================
  # Lightweight stand-in for the real Matrix homeserver so unit and
  # integration tests never need the production tuwunel instance or
  # custom DNS. Ignored by `docker compose up` (no default profile);
  # started by `docker compose --profile test up`. The network alias
  # `tuwunel` makes HOMESERVER_URL=http://tuwunel:8008 resolve to it.
  tuwunel-mock:
    build:
      context: ./tests/mock-tuwunel
    container_name: tuwunel-mock
    networks:
      homeserver_internal:
        aliases:
          - tuwunel
    profiles:
      - test

networks:
  homeserver_internal:
    driver: bridge

volumes:
  homepage_node_modules:
  static_build:
  caddy_data:
  caddy_config:
