services:
  # ============================================================
  # Auth Service - Matrix Auth Gateway
  # ============================================================
  # Flask app for Matrix room-based authentication
  # See: AuthService/whatisthis.md for details
  matrix-auth-gateway:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: matrix-auth-gateway
    ports:
      - "5000:5000"
    environment:
      - HOMESERVER_URL=${HOMESERVER_URL:-http://tuwunel:8008}
      - BOT_ACCESS_TOKEN=${BOT_ACCESS_TOKEN}
      - GATEWAY_SECRET_KEY=${GATEWAY_SECRET_KEY}
      - MATRIX_SERVER_NAME=${MATRIX_SERVER_NAME:-keinstein0.ch}
      - SESSION_MAX_AGE=604800
      - MEMBERSHIP_CACHE_TTL=60
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - homeserver_internal
    restart: unless-stopped

  # ============================================================
  # Status API - System Status Monitoring
  # ============================================================
  # Lightweight Go microservice for checking service health.
  # See: StatusAPI/designfile.md for architecture details
  status-api:
    build:
      context: .
      dockerfile: StatusAPI/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-homeserver}_status-api
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-10}
      - AUTH_SERVICE_URL=http://matrix-auth-gateway:5000
      - HOMESERVER_URL=${HOMESERVER_URL:-http://tuwunel:8008}
      - HOMEPAGE_URL=http://homepage:5173
      - CADDY_URL=http://caddy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - homeserver_internal
    depends_on:
      matrix-auth-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Homepage - Svelte/Vite Application
  # ============================================================
  # Main web application with live previews via Vite
  homepage:
    build:
      context: Homepage
      dockerfile: Dockerfile.dev
    container_name: ${COMPOSE_PROJECT_NAME:-homeserver}_homepage
    ports:
      - "5173:5173"  # Vite dev server
      - "4173:4173"  # Vite preview (production-like)
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
      - VITE_AUTH_SERVICE_URL=http://matrix-auth-gateway:5000
      - VITE_MATRIX_SERVER=${MATRIX_SERVER_NAME:-keinstein0.ch}
    volumes:
      - ./Homepage:/app:rw
      - homepage_node_modules:/app/node_modules
      - static_build:/build_output
    networks:
      - homeserver_internal
    profiles:
      - dev
    #command: npm run dev -- --host 0.0.0.0

  # ============================================================
  # Caddy - Reverse Proxy & Auth Handler
  # ============================================================
  # Handles routing, TLS, and Matrix auth forwarding
  caddy:
    image: caddy:2.11
    container_name: ${COMPOSE_PROJECT_NAME:-homeserver}_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # For HTTP/3
    volumes:
      - ./Caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_build:/apps/homepage:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_INGRESS_IP=${CADDY_INGRESS_IP:-}

      # Site labels for the Caddyfile (see Caddy/Caddyfile header comment).
      # In this test/dev stack every site serves plain HTTP on :80, matching
      # AUTO_HTTPS=off. Unset in prod, where the Caddyfile defaults apply.
      - SITE_DOMAIN=http://localhost
      - PROTOCOL=http
      - AUTO_HTTPS=off
      - MATRIX_SITE=http://matrix.keinstein0.ch
      - STATUS_SITE=http://status.keinstein0.ch
      - WWW_SITE=http://www.keinstein0.ch, http://localhost

    # Docker's embedded DNS makes these production hostnames resolve to this
    # Caddy container inside homeserver_internal. The integration suite runs
    # in-network (test-runner service) and therefore exercises the exact
    # production virtual hosts without any host-level DNS overrides.
    networks:
      homeserver_internal:
        aliases:
          - matrix.keinstein0.ch
          - status.keinstein0.ch
          - www.keinstein0.ch
    depends_on:
      matrix-auth-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # The www vhost (reachable as "localhost" on :80 in this stack) must be
      # able to serve the static login page from the homepage-build one-shot.
      test: ["CMD", "curl", "-f", "http://localhost:80/login.html"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ============================================================
  # Test Runner - in-network integration suite (test profile)
  # ============================================================
  # pytest runs INSIDE the compose network so the production hostnames
  # (matrix/status/www.keinstein0.ch) resolve to the local Caddy container
  # via the DNS aliases above, instead of to the real servers. The whole
  # repo is mounted read-only at /workspace so INT-CMP-01/02 can run
  # `docker compose config` / `ps` against the same project (socket mounted,
  # CLI + compose plugin installed at start). Lifecycle (up -> run -> down)
  # is owned by scripts/ci.sh and .github/workflows/ci.yml.
  test-runner:
    image: python:3.12-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-homeserver}_test-runner
    working_dir: /workspace/tests/integration
    volumes:
      - .:/workspace:ro
      - ./tests/integration:/workspace/tests/integration:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-homeserver}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PYTHONDONTWRITEBYTECODE=1
    command: sh -c "apk add --no-cache docker-cli docker-cli-compose >/dev/null && pip install --quiet -r requirements.txt && pytest -v"
    networks:
      - homeserver_internal
    profiles:
      - test

  # ============================================================
  # Homepage Build - one-shot static build for test profile
  # ============================================================
  # Under the test profile the dev homepage service (above) is absent, so
  # the shared static_build volume would stay empty and Caddy could not
  # serve /login.html or /index.html. This one-shot service builds the
  # SvelteKit static output and copies it to the shared volume, then exits.
  # Caddy's test health-wait (polling /login.html -> 200) naturally blocks
  # until this completes.
  homepage-build:
    build:
      context: Homepage
      dockerfile: Dockerfile.dev
    container_name: homepage-build
    volumes:
      - static_build:/build_output
    profiles:
      - test
    command: sh -c "npx vite build && rm -rf /build_output/* && cp -r build/* /build_output/"

  # ============================================================
  # Tuwunel Mock - Matrix Homeserver mock (test/dev only)
  # ============================================================
  # Lightweight stand-in for the real Matrix homeserver so unit and
  # integration tests never need the production tuwunel instance or
  # custom DNS. Ignored by `docker compose up` (no default profile);
  # started by `docker compose --profile test up`. The network alias
  # `tuwunel` makes HOMESERVER_URL=http://tuwunel:8008 resolve to it.
  # Port 8008 is published for host-side debugging only; the in-network
  # test-runner reaches it directly as http://tuwunel:8008.
  tuwunel-mock:
    build:
      context: ./tests/mock-tuwunel
    container_name: tuwunel-mock
    ports:
      - "8008:8008"
    networks:
      homeserver_internal:
        aliases:
          - tuwunel
    profiles:
      - test

networks:
  homeserver_internal:
    driver: bridge

volumes:
  homepage_node_modules:
  static_build:
  caddy_data:
  caddy_config:
